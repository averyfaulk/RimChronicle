name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Resolve commit range to scan
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000

          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE"; head="$PR_HEAD"
          else
            base="$PUSH_BEFORE"; head="$SHA"
          fi

          # No base means a branch creation - nothing to diff against.
          if [ -z "$base" ] || [ "$base" = "$zero" ]; then
            echo "No base commit for this event; new-secret scan will be skipped."
            exit 0
          fi

          # Fail loudly rather than silently scanning nothing. A missing object
          # (e.g. a PR head that was not fetched) would otherwise look clean.
          for ref in "$base" "$head"; do
            if ! git cat-file -e "${ref}^{commit}" 2>/dev/null; then
              echo "::error::commit ${ref} is not present in this checkout - cannot scan"
              exit 1
            fi
          done

          count=$(git rev-list --count "${base}..${head}")
          echo "range=${base}..${head}" >> "$GITHUB_OUTPUT"
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          echo "Scanning ${count} new commit(s)."

      - name: Fail on newly introduced secrets
        if: steps.range.outputs.range != ''
        env:
          RANGE: ${{ steps.range.outputs.range }}
          EXPECTED: ${{ steps.range.outputs.count }}
        run: |
          set -uo pipefail
          gitleaks git --redact --verbose --no-banner --log-opts="$RANGE" . 2>&1 | tee /tmp/gitleaks.log
          status=${PIPESTATUS[0]}

          if [ "$status" -ne 0 ]; then
            echo "::error::gitleaks found secrets in: $RANGE"
            exit "$status"
          fi

          scanned=$(grep -oE '[0-9]+ commits scanned' /tmp/gitleaks.log | grep -oE '^[0-9]+' | tail -1 || true)
          scanned=${scanned:-0}
          if [ "$scanned" -lt "$EXPECTED" ]; then
            echo "::error::gitleaks scanned ${scanned} commit(s) but ${EXPECTED} were in range - refusing to pass a no-op scan"
            exit 1
          fi
          echo "Scanned ${scanned} commit(s), no new secrets."

      - name: Report outstanding historical findings
        if: always()
        run: |
          set -uo pipefail
          gitleaks git --redact --no-banner --exit-code 0 \
            -f json -r /tmp/history.json --log-opts="--all" . > /dev/null 2>&1 || true
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          path = "/tmp/history.json"
          findings = json.load(open(path)) if os.path.exists(path) else []
          print("### Secret scan - full history audit\n")
          if not findings:
              print("No secrets found anywhere in history. Clean.")
          else:
              print(f"{len(findings)} finding(s) in committed history. These are "
                    "**known debt** and deliberately do not fail this build; newly "
                    "introduced secrets are blocked by the previous step.\n")
              print("| Rule | File | Commit |")
              print("| --- | --- | --- |")
              for f in findings:
                  print(f"| `{f['RuleID']}` | `{f['File']}` | `{f['Commit'][:7]}` |")
              print("\nRotating the exposed credential is what removes the risk. "
                    "Erasing it from history needs a rewrite plus a force-push of "
                    "the affected tags.")
          PY

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-report
          path: /tmp/history.json
          if-no-files-found: ignore
